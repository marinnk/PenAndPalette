name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ruff（Lint / フォーマット）＋ pytest。pytest-django が MySQL 上に test_pen_and_palette という
  # 使い捨てDBを作るため、docker-compose.yml の db サービス（mysql-init の権限付与を含む）を使う。
  backend-test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # mysqlclient のビルドに必要なシステムライブラリ
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      # docker-compose.yml の db サービスは healthcheck 付き。--wait で healthy になるまでブロックする。
      - name: Start MySQL
        run: docker compose up -d --wait db

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        run: pytest

  # ESLint ＋ Vitest ＋ ビルド（vue-tsc の型チェックを含む）
  frontend-test:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Playwright E2E（scenarios トラックのみ）。e2e/run.sh と同じ前提（backend 8000・frontend 5173・
  # DB 3306・MinIO 9000）を CI 上に再現する。performance トラック・perf-tests は対象外。
  e2e-scenarios:
    name: E2E (Playwright scenarios)
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      # docker-compose.yml の既定値が backend/.env.example・frontend/.env.example の既定値と
      # 一致しているため、.env をコピーするだけでそのまま繋がる
      - name: Prepare env files
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Start DB / MinIO
        run: |
          docker compose up -d --wait db minio
          docker compose up -d minio-init   # 一度きりのバケット作成（exit 0）。--wait 対象にはしない

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Migrate (creates schema + seeds classification tags)
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Start backend (background)
        working-directory: backend
        run: nohup python manage.py runserver 8000 --noreload > /tmp/backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sS -f -o /dev/null http://localhost:8000/api/health; then
              echo "backend is up"; exit 0
            fi
            sleep 3
          done
          echo "backend did not become ready in time" >&2; cat /tmp/backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend (background)
        working-directory: frontend
        run: nohup npm run dev -- --strictPort > /tmp/frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sS -f -o /dev/null http://localhost:5173/; then
              echo "frontend is up"; exit 0
            fi
            sleep 3
          done
          echo "frontend did not become ready in time" >&2; cat /tmp/frontend.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E scenarios
        working-directory: e2e
        run: npx playwright test --project=scenarios

      - name: Upload report & server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/playwright-report/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
